<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영등포 화재조사팀 스케줄표</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        .no-tap-highlight { -webkit-tap-highlight-color: transparent; }
        
        /* 초과근무 선택 버튼 스타일 */
        input[type="radio"]:checked + label {
            background-color: #3b82f6; /* 파란색 */
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative">
        <!-- 상단 헤더 -->
        <div class="flex justify-between items-center p-4 bg-gray-800 text-white sticky top-0 z-10">
            <button id="prevBtn" class="p-2 no-tap-highlight text-xl font-bold">&lt;</button>
            <h1 id="monthTitle" class="text-xl font-bold tracking-tight">2026년 10월</h1>
            <button id="nextBtn" class="p-2 no-tap-highlight text-xl font-bold">&gt;</button>
        </div>

        <!-- 요일 -->
        <div class="grid grid-cols-7 text-center font-bold text-sm py-3 border-b bg-gray-50">
            <div class="text-red-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500">토</div>
        </div>

        <!-- 달력 날짜 그리드 -->
        <div id="calendarGrid" class="grid grid-cols-7 auto-rows-[100px] border-b bg-white">
            <!-- 자바스크립트로 채워짐 -->
        </div>
    </div>

    <!-- 스케줄 입력 팝업창 -->
    <div id="scheduleModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
        <div class="bg-white p-5 rounded-xl w-11/12 max-w-sm shadow-2xl">
            <h2 id="modalDateTitle" class="text-lg font-bold mb-4 text-gray-800 border-b pb-2"></h2>
            
            <!-- 초과근무 선택 (라디오 버튼) -->
            <div class="mb-4">
                <label class="block text-sm font-semibold mb-2 text-gray-700">초과근무 유형</label>
                <div class="grid grid-cols-4 gap-2 text-sm text-center">
                    <div>
                        <input type="radio" id="otNone" name="overtimeType" value="" class="hidden" checked>
                        <label for="otNone" class="block border border-gray-300 rounded p-2 cursor-pointer transition">없음</label>
                    </div>
                    <div>
                        <input type="radio" id="otDay" name="overtimeType" value="주간" class="hidden">
                        <label for="otDay" class="block border border-gray-300 rounded p-2 cursor-pointer transition">주간</label>
                    </div>
                    <div>
                        <input type="radio" id="otNight" name="overtimeType" value="야간" class="hidden">
                        <label for="otNight" class="block border border-gray-300 rounded p-2 cursor-pointer transition">야간</label>
                    </div>
                    <div>
                        <input type="radio" id="otPart" name="overtimeType" value="시간" class="hidden">
                        <label for="otPart" class="block border border-gray-300 rounded p-2 cursor-pointer transition">시간</label>
                    </div>
                </div>
            </div>

            <!-- 근무자 이름 -->
            <div class="mb-4">
                <label class="block text-sm font-semibold mb-1 text-gray-700">초과 근무자</label>
                <input type="text" id="workerName" placeholder="예: 파닥몬, 펭펭몬(09~11)" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <!-- 팀 스케줄 메모 -->
            <div class="mb-5">
                <label class="block text-sm font-semibold mb-1 text-gray-700">팀 일정 및 메모</label>
                <textarea id="memoInput" rows="2" placeholder="예: 14시 국과수 방문" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
            </div>

            <div class="flex justify-end gap-2">
                <button id="closeModalBtn" class="px-4 py-2 bg-gray-200 text-gray-700 font-semibold rounded-lg">취소</button>
                <button id="saveScheduleBtn" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow">저장</button>
            </div>
        </div>
    </div>

    <!-- Firebase 및 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // ==========================================
        const firebaseConfig = {
            apiKey: "본인의_API_KEY",
            authDomain: "본인의_PROJECT_ID.firebaseapp.com",
            databaseURL: "본인의_DATABASE_URL",
            projectId: "본인의_PROJECT_ID",
            storageBucket: "본인의_PROJECT_ID.appspot.com",
            messagingSenderId: "본인의_SENDER_ID",
            appId: "본인의_APP_ID"
        };
        // ==========================================

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth() + 1;
        let selectedDateId = ""; 
        let globalScheduleData = {}; 

        // 3교대 기준일 설정 (예: 2026년 10월 7일을 '당번' 기준으로 설정)
        // 필요에 따라 이 날짜를 본인 팀의 실제 당번일로 수정하세요.
        const baseDutyDate = new Date(2026, 9, 7); 

        const calendarGrid = document.getElementById('calendarGrid');
        const modal = document.getElementById('scheduleModal');
        const workerName = document.getElementById('workerName');
        const memoInput = document.getElementById('memoInput');

        // Firebase 데이터 구독 (데이터 구조를 객체로 변경)
        const schedulesRef = ref(db, 'schedules_v2'); 
        onValue(schedulesRef, (snapshot) => {
            globalScheduleData = snapshot.val() || {};
            renderCalendar(currentYear, currentMonth);
        });

        // 3교대 당비비 색상 계산 함수
        function getShiftColorClass(year, month, day) {
            const targetDate = new Date(year, month - 1, day);
            const diffTime = targetDate.getTime() - baseDutyDate.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            // 3일 주기 계산 (0: 당번, 1: 비번1, 2: 비번2)
            // 음수 처리 보정
            let shiftCycle = diffDays % 3;
            if (shiftCycle < 0) shiftCycle += 3;

            if (shiftCycle === 0) return 'bg-orange-50';   // 당번: 연한 살구색
            if (shiftCycle === 1) return 'bg-teal-50';     // 비번1: 연한 민트색
            if (shiftCycle === 2) return 'bg-indigo-50';   // 비번2: 연한 라벤더색
            return 'bg-white';
        }

        function renderCalendar(year, month) {
            calendarGrid.innerHTML = ''; 
            document.getElementById('monthTitle').textContent = `${year}년 ${month}월`;

            const firstDay = new Date(year, month - 1, 1).getDay();
            const lastDate = new Date(year, month, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'border-r border-b bg-gray-100 opacity-50';
                calendarGrid.appendChild(emptyDiv);
            }

            for (let i = 1; i <= lastDate; i++) {
                const dateString = `${year}-${String(month).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                const dateDiv = document.createElement('div');
                // 배경색 함수 적용
                const shiftBgColor = getShiftColorClass(year, month, i);
                dateDiv.className = `border-r border-b p-1 flex flex-col relative active:bg-gray-200 no-tap-highlight cursor-pointer ${shiftBgColor}`;
                
                const daySpan = document.createElement('span');
                daySpan.className = 'text-xs font-bold mb-1';
                const currentDayOfWeek = new Date(year, month - 1, i).getDay();
                if (currentDayOfWeek === 0) daySpan.classList.add('text-red-500');
                if (currentDayOfWeek === 6) daySpan.classList.add('text-blue-500');
                daySpan.textContent = i;
                dateDiv.appendChild(daySpan);

                const contentDiv = document.createElement('div');
                contentDiv.className = 'text-[10px] leading-tight overflow-hidden whitespace-pre-wrap flex flex-col gap-1';
                
                // 데이터가 있을 경우 표시
                const dayData = globalScheduleData[dateString];
                if (dayData) {
                    if (dayData.overtimeType && dayData.workerName) {
                        const otLabel = document.createElement('span');
                        otLabel.className = 'font-bold text-blue-700 bg-white/60 px-1 rounded-sm block';
                        otLabel.textContent = `[${dayData.overtimeType}] ${dayData.workerName}`;
                        contentDiv.appendChild(otLabel);
                    }
                    if (dayData.memo) {
                        const memoLabel = document.createElement('span');
                        memoLabel.className = 'text-gray-700 block';
                        memoLabel.textContent = dayData.memo;
                        contentDiv.appendChild(memoLabel);
                    }
                }
                
                dateDiv.appendChild(contentDiv);

                // 클릭 이벤트 (데이터 바인딩)
                dateDiv.addEventListener('click', () => {
                    selectedDateId = dateString;
                    document.getElementById('modalDateTitle').textContent = `${year}년 ${month}월 ${i}일 일정`;
                    
                    // 초기화
                    document.getElementById('otNone').checked = true;
                    workerName.value = '';
                    memoInput.value = '';

                    if (dayData) {
                        if (dayData.overtimeType) {
                            const radioBtn = document.querySelector(`input[name="overtimeType"][value="${dayData.overtimeType}"]`);
                            if(radioBtn) radioBtn.checked = true;
                        }
                        workerName.value = dayData.workerName || '';
                        memoInput.value = dayData.memo || '';
                    }
                    
                    modal.classList.remove('hidden');
                });

                calendarGrid.appendChild(dateDiv);
            }
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        document.getElementById('saveScheduleBtn').addEventListener('click', () => {
            const selectedType = document.querySelector('input[name="overtimeType"]:checked').value;
            const worker = workerName.value.trim();
            const memo
