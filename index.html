<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>서울 소방 화재조사팀 스케줄표</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        .no-tap-highlight { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- 메인 달력 화면 -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative">
        <!-- 상단 헤더 (월 이동) -->
        <div class="flex justify-between items-center p-4 bg-blue-700 text-white sticky top-0 z-10">
            <button id="prevBtn" class="p-2 no-tap-highlight text-xl font-bold">&lt;</button>
            <h1 id="monthTitle" class="text-xl font-bold tracking-tight">2026년 10월</h1>
            <button id="nextBtn" class="p-2 no-tap-highlight text-xl font-bold">&gt;</button>
        </div>

        <!-- 요일 표시 -->
        <div class="grid grid-cols-7 text-center font-bold text-sm py-3 border-b bg-gray-50">
            <div class="text-red-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500">토</div>
        </div>

        <!-- 달력 날짜 그리드 -->
        <div id="calendarGrid" class="grid grid-cols-7 auto-rows-[90px] border-b bg-white">
            <!-- 자바스크립트로 날짜가 채워집니다 -->
        </div>
    </div>

    <!-- 스케줄 입력 팝업창 (모달) -->
    <div id="scheduleModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
        <div class="bg-white p-6 rounded-xl w-5/6 max-w-sm shadow-2xl">
            <h2 id="modalDateTitle" class="text-lg font-bold mb-4 text-blue-700"></h2>
            <label class="block text-sm font-semibold mb-2">근무 및 일정 입력</label>
            <textarea id="scheduleInput" rows="3" placeholder="예: 당번(파닥몬)&#10;주간초과(펭펭몬) 09:00~11:00&#10;오후 국과수 감정" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4 text-sm"></textarea>
            <div class="flex justify-end gap-3">
                <button id="closeModalBtn" class="px-4 py-2 bg-gray-200 text-gray-700 font-semibold rounded-lg">닫기</button>
                <button id="saveScheduleBtn" class="px-4 py-2 bg-blue-700 text-white font-semibold rounded-lg">저장하기</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 및 달력 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // ==========================================
        // [중요] 아래 firebaseConfig 내용을 본인의 코드로 덮어씌우세요!
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyB_VB9Jt0fJvoxD76PtnYiHL59EZrmtSwA",
            authDomain: "schedule-bydy.firebaseapp.com",
            projectId: "schedule-bydy",
            storageBucket: "schedule-bydy.firebasestorage.app",
            messagingSenderId: "722259608031",
            appId: "1:722259608031:web:dd3a7b0ac9758ed8bd046a"
        };
        // ==========================================

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 상태 변수
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth() + 1;
        let selectedDateId = ""; 
        let globalScheduleData = {}; // Firebase에서 불러온 전체 데이터

        // DOM 요소
        const monthTitle = document.getElementById('monthTitle');
        const calendarGrid = document.getElementById('calendarGrid');
        const modal = document.getElementById('scheduleModal');
        const modalDateTitle = document.getElementById('modalDateTitle');
        const scheduleInput = document.getElementById('scheduleInput');

        // Firebase 데이터 실시간 구독 (schedules 경로)
        const schedulesRef = ref(db, 'schedules');
        onValue(schedulesRef, (snapshot) => {
            globalScheduleData = snapshot.val() || {};
            renderCalendar(currentYear, currentMonth); // 데이터가 바뀔 때마다 달력 다시 그리기
        });

        // 달력 렌더링 함수
        function renderCalendar(year, month) {
            calendarGrid.innerHTML = ''; // 초기화
            monthTitle.textContent = `${year}년 ${month}월`;

            const firstDay = new Date(year, month - 1, 1).getDay();
            const lastDate = new Date(year, month, 0).getDate();

            // 빈 칸 채우기
            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'border-r border-b bg-gray-50';
                calendarGrid.appendChild(emptyDiv);
            }

            // 날짜 채우기
            for (let i = 1; i <= lastDate; i++) {
                const dateDiv = document.createElement('div');
                dateDiv.className = 'border-r border-b p-1 flex flex-col relative active:bg-gray-100 no-tap-highlight cursor-pointer';
                
                // 날짜 포맷 (예: 2026-10-07)
                const dateString = `${year}-${String(month).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                // 날짜 숫자
                const daySpan = document.createElement('span');
                daySpan.className = 'text-xs font-bold mb-1';
                // 일요일은 빨간색, 토요일은 파란색
                const currentDayOfWeek = new Date(year, month - 1, i).getDay();
                if (currentDayOfWeek === 0) daySpan.classList.add('text-red-500');
                if (currentDayOfWeek === 6) daySpan.classList.add('text-blue-500');
                daySpan.textContent = i;
                dateDiv.appendChild(daySpan);

                // Firebase 데이터 표시 영역
                const contentDiv = document.createElement('div');
                contentDiv.className = 'text-[10px] leading-tight overflow-hidden text-gray-700 whitespace-pre-wrap';
                
                // 만약 해당 날짜에 데이터가 있다면
                if (globalScheduleData[dateString]) {
                    contentDiv.textContent = globalScheduleData[dateString];
                    // 일정 강조를 위해 옅은 배경색 추가
                    dateDiv.classList.add('bg-blue-50'); 
                }
                
                dateDiv.appendChild(contentDiv);

                // 클릭 이벤트 (팝업 열기)
                dateDiv.addEventListener('click', () => {
                    selectedDateId = dateString;
                    modalDateTitle.textContent = `${year}년 ${month}월 ${i}일 스케줄`;
                    scheduleInput.value = globalScheduleData[dateString] || ''; // 기존 데이터 불러오기
                    modal.classList.remove('hidden');
                });

                calendarGrid.appendChild(dateDiv);
            }
        }

        // 팝업 닫기 버튼
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        // 팝업 저장 버튼 (Firebase에 저장)
        document.getElementById('saveScheduleBtn').addEventListener('click', () => {
            const newSchedule = scheduleInput.value.trim();
            const dateRef = ref(db, `schedules/${selectedDateId}`);
            
            // 입력칸이 비어있으면 데이터 삭제, 아니면 덮어쓰기
            set(dateRef, newSchedule ? newSchedule : null)
                .then(() => {
                    modal.classList.add('hidden');
                })
                .catch((error) => {
                    alert("저장 실패: " + error);
                });
        });

        // 월 이동 버튼
        document.getElementById('prevBtn').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 1) { currentMonth = 12; currentYear--; }
            renderCalendar(currentYear, currentMonth);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            renderCalendar(currentYear, currentMonth);
        });

    </script>
</body>
</html>
